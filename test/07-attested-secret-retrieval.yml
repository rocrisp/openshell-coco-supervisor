apiVersion: openshell.coco/v1alpha1
kind: TestSuite
metadata:
  name: attested-secret-retrieval
spec:
  description: >-
    Create a kata-remote workload with injected initdata, wait for it to attest
    to Trustee, and confirm it can retrieve the configured KBS resource.
  steps:
    - name: Clean up any previous attestation test Pod
      command: oc delete pod openshell-attestation-test -n openshell --ignore-not-found --wait=true
      expect:
        exitCode: 0

    - name: Check Trustee test resource
      command: oc get secret kbsres1 -n trustee-operator-system
      expect:
        exitCode: 0
        outputContains: kbsres1

    - name: Check supervisor initdata ConfigMap
      command: oc get configmap openshell-supervisor-initdata -n openshell
      expect:
        exitCode: 0
        outputContains: openshell-supervisor-initdata

    - name: Create attestation test Pod
      command: |-
        cat <<'EOF' | oc apply -f -
        apiVersion: v1
        kind: Pod
        metadata:
          name: openshell-attestation-test
          namespace: openshell
          annotations:
            coco.io/initdata-configmap: openshell-supervisor-initdata
        spec:
          runtimeClassName: kata-remote
          terminationGracePeriodSeconds: 5
          initContainers:
            - name: trustee
              image: registry.access.redhat.com/ubi9/ubi-minimal:latest
              command:
                - sh
                - -c
                - >-
                  curl -fsS -o /dev/null
                  http://127.0.0.1:8006/cdh/resource/default/kbsres1/key1
              securityContext:
                runAsNonRoot: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                seccompProfile:
                  type: RuntimeDefault
          containers:
            - name: sanity
              image: registry.access.redhat.com/ubi9/ubi-minimal:latest
              command: ["sleep", "infinity"]
              securityContext:
                runAsNonRoot: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                seccompProfile:
                  type: RuntimeDefault
        EOF
      expect:
        exitCode: 0
        outputContains: openshell-attestation-test

    - name: Wait for attestation and Trustee resource retrieval
      command: oc wait --for=condition=Ready pod/openshell-attestation-test -n openshell --timeout=600s
      expect:
        exitCode: 0
        outputContains: condition met

    - name: Check Kata runtime class on the attestation test Pod
      command: oc get pod openshell-attestation-test -n openshell -o jsonpath='{.spec.runtimeClassName}'
      expect:
        exitCode: 0
        outputContains: kata-remote

    - name: Check Kyverno-injected initdata annotation
      command: oc get pod openshell-attestation-test -n openshell -o jsonpath='{.metadata.annotations}'
      expect:
        exitCode: 0
        outputContains: cc_init_data

    - name: Check Trustee init container exit code
      command: oc get pod openshell-attestation-test -n openshell -o jsonpath='{.status.initContainerStatuses[0].state.terminated.exitCode}'
      expect:
        exitCode: 0
        outputContains: "0"

    - name: Delete attestation test Pod
      command: oc delete pod openshell-attestation-test -n openshell --wait=true
      expect:
        exitCode: 0
        outputContains: deleted
