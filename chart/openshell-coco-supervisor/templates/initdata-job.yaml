{{- if .Values.initdata.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-initdata
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openshell-coco.labels" . | nindent 4 }}
    app.kubernetes.io/component: initdata
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        {{- include "openshell-coco.labels" . | nindent 8 }}
        app.kubernetes.io/component: initdata
    spec:
      restartPolicy: Never
      serviceAccountName: {{ .Values.initdata.serviceAccountName }}
      containers:
        - name: create-initdata
          image: {{ .Values.initdata.hookImage | quote }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "/scripts/create-supervisor-initdata.sh"]
          env:
            - name: TRUSTEE_NAMESPACE
              value: {{ .Values.initdata.trusteeNamespace | quote }}
            - name: TRUSTEE_SECRET_NAME
              value: {{ .Values.initdata.trusteeSecretName | quote }}
            - name: TRUSTEE_URL
              value: {{ .Values.initdata.trusteeURL | quote }}
            - name: TARGET_NAMESPACE
              value: {{ .Values.initdata.targetNamespace | quote }}
            - name: CONFIGMAP_NAME
              value: {{ .Values.initdata.configMapName | quote }}
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: {{ .Release.Name }}-initdata-script
            defaultMode: 0755
{{- end }}
